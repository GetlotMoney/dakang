# 本文件不含任何口令明文：凭据一律取同名环境变量，模板见仓库根 .env.example。
# 本地直跑（非容器）时先 `set -a; . .env; set +a` 再启动，否则口令为空连不上库。
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 本地 Docker MySQL（deploy/docker-compose.yml 宿主端口 3308），独立库 dakang
      url: jdbc:mysql://localhost:3308/dakang?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC&nullCatalogMeansCurrent=true
      username: ${DAKANG_DB_USERNAME:root}
      password: ${DAKANG_DB_PASSWORD:}
  redis:
    # 本地 Docker Redis（deploy/docker-compose.yml 宿主端口 6380）
    host: localhost
    port: 6380
    password: ${DAKANG_REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
  ratelimiter:
    redis-address: redis://localhost:6380
    redis-password: ${DAKANG_REDIS_PASSWORD:}
    redis-database: 0
    enabled: true
    exceptionHandler:
      enable: true

# MQTT 设备接入（EMQX，deploy/docker-compose.yml 宿主端口 1883；管理台 18083）
# 设备接入已启用（2026-07-12 设备中控模块联调）；broker 不在线时仅记错误日志不阻断启动
mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: dakang-server-dev
  # 当前 EMQX 未开认证，留空即匿名接入；生产开认证后经 .env 注入
  username: ${DAKANG_MQTT_USERNAME:}
  password: ${DAKANG_MQTT_PASSWORD:}

# 身份自动审核、演示控制与模拟提现总闸；普通 dev 也缺省关闭。
demo-simulation:
  enabled: ${DAKANG_DEMO_SIMULATION_ENABLED:false}

ali:
  oss:
    # TODO 待配置：使用六维达康项目自己的 OSS Bucket 与 AK/SK，禁止复用其他项目凭据
    url: ""
    endpoint: ""
    bucketName: ""
    region: ""
    ossAccessKeyId: ""
    ossAccessKeySecret: ""

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

wechat:
  xcx:
    # 小程序主体已完成微信认证，AppID 已固定（用户端/机主端/配送端统一入口）。
    # AppID 与 AppSecret 均按凭据管理：真值只能经 .env 的 WECHAT_XCX_APPID/WECHAT_XCX_APPSECRET
    # 注入，本文件与任何入库文件都不得出现字面量（含注释）。由 tools/check-secret-leak.py 看守。
    appid: ${WECHAT_XCX_APPID:}
    appsecret: ${WECHAT_XCX_APPSECRET:}
  pay:
    # 微信支付 APIv3 商户凭据（WX-ECO S3）。六项缺任何一项即视为未配置，
    # 所有支付组件 fail-closed 拒绝执行。多行 PEM 走文件路径（容器 secret 挂载），
    # 不进环境变量本体；其余真值只经 .env 注入，本文件不得出现字面量（含注释）。
    mchid: ${WECHAT_PAY_MCHID:}
    merchant-serial: ${WECHAT_PAY_MERCHANT_SERIAL:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    platform-public-key-id: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_ID:}
    platform-public-key-path: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:}
    # 出站 HTTP 适配器开关：默认 false=fail-closed 兜底实现在位（恒拒绝）。
    # 联调轮真实实现以 havingValue=true 注册，两者属性互斥、不可能并存。
    http-client:
      enabled: ${WECHAT_PAY_HTTP_CLIENT_ENABLED:false}
  notify:
    # 订阅消息真实发送适配器开关：默认 false=兜底实现在位（一律不发、绝不返回成功）。
    http-sender:
      enabled: ${WECHAT_NOTIFY_HTTP_SENDER_ENABLED:false}
  shipping:
    # 发货管理同步适配器开关：默认 false=兜底在位且 Worker 休眠；
    # 待同步行保持待处理，开启后自然补投（绝不把"没接入"写成终态）。
    http-client:
      enabled: ${WECHAT_SHIPPING_HTTP_CLIENT_ENABLED:false}

mini:
  auth:
    phoneless-register:
      # 仅微信身份建号。取值必须与 prod 同源：此前这里硬编码 true，而 prod 读 .env，
      # 于是 `mvn spring-boot:run`（默认 profile 就是 dev）永远走「无手机号建号」，
      # 与 docker/验收环境相反——同一份代码在两处表现不同，且没有任何东西会报错。
      # 主体已于 2026-08-11 完成微信认证，getPhoneNumber 组件恢复可用，故缺省为 false
      # （注册即绑号）；组件因额度用尽等平台侧原因不可用时才由 .env 覆盖为 true。
      enabled: ${MINI_PHONELESS_REGISTER_ENABLED:false}
  test-login:
    # 测试登录（按手机号直签 KH_USER 会话）。**默认关闭且写显式**：它凭一个已注册手机号
    # 就能取得该用户的完整会话，危险度高于 Pay-Sim（后者伪造的是带永久来源标记的收款事实）。
    # 曾与 mini.pay-sim.enabled 共用一个开关，导致「为跑通商城链开 Pay-Sim」顺带在正式登录
    # 环境里打开了身份绕过（2026-08-11 实测可签出有效 Token）。隔离验收环境显式置 true 供
    # 九个 e2e 跑批脚本使用；演示与生产一律保持 false。
    enabled: ${MINI_TEST_LOGIN_ENABLED:false}
  pay-sim:
    # Pay-Sim 模拟支付：仅 dev/演示环境为 true。为 true 时 PaySimSourceAdapter 与 /mini/pay-sim/**
    # 才会注册，且支付单被永久打上 PAY_SOURCE=2，模拟收款不可能混进真实微信对账口径。
    # prod 配置里必须保持 false 或缺省（缺省即 false）。
    enabled: true
  refund-sim:
    # Refund-Sim 模拟退款：与 pay-sim **独立**的开关，绝不复用同一项。
    # 退款是出账，比收款危险一个量级；任何为了跑通支付而开模拟的环境，
    # 不应连模拟退款一起打开，两者必须能分别授权。
    # 为 true 时 RefundSimSourceAdapter 与 /mini/refund-sim/** 才注册，
    # 退款单被永久打上 REFUND_SOURCE=2，模拟退款不可能混进真实微信退款对账口径。
    # 为 false/缺省时注册的是 WechatRefundSourceAdapter —— 它是 fail-closed 空实现，
    # 会直接拒绝发起退款（R0-8：真实凭据未配置时禁止回退 Refund-Sim）。
    enabled: true

mall:
  # 商城订单付款窗（分钟）：创单时冻结进订单与支付单，创建后不可改。
  # 到期本身不构成关闭依据——超时关单必须先拿到支付方查单 CLOSED（见 MallOrderExpireWorker）。
  pay-expire-minutes: 30
  pay-sim:
    # 商城 Pay-Sim：与一期 mini.pay-sim **独立**的开关，绝不复用同一项。
    # 两条链的资金对象不同（商城订单 vs 取水/充值订单），开一个不等于该开另一个。
    # 为 true 时 /mini/mall/pay-sim/** 与商城查单适配器才注册，支付单被永久打上 PAY_SOURCE=2。
    # 为 false/缺省时：模拟支付端点不存在，且超时关单因拿不到权威答复而整体停摆（刻意的 fail-closed）。
    enabled: true
  # Refund-Sim 商城模拟退款：与 mall.pay-sim 和一期 mini.refund-sim 三者**完全独立**。
  # 退款是出账，比收款危险一个量级：为了跑通支付而开模拟的环境，不该连模拟退款一起打开。
  # 为 true 时 /mall/refund-sim/** 才注册；为 false/缺省时端点不存在，退款只能等真实渠道事实。
  refund-sim:
    enabled: false
  logistics-sim:
    # Logistics-Sim 内部模拟承运商：与两个资金模拟开关**再次独立**——物流是发货动作，
    # 与收款/退款各自授权。为 true 时 LogisticsSimAdapter 与 /mall/logistics/sim-event 才注册；
    # 为 false/缺省时适配器 Bean 不存在，Worker 取不到承运商即整批转人工，
    # 不会静默降级成「假装发出去了」。
    enabled: true
  # 售后申请窗（天）：**内部模拟默认值**，甲方正式规则未定，不得对外表述为最终业务规则。
  after-sale-window-days: 7

delivery:
  # 开发环境缺省关闭；需要老板测试联动时同样必须显式提供环境变量。
  demo-sim:
    enabled: ${DELIVERY_DEMOSIM_ENABLED:false}
    customer-phone: ${DELIVERY_DEMOSIM_CUSTOMER_PHONE:}
    courier-phone: ${DELIVERY_DEMOSIM_COURIER_PHONE:13800001111}
    station-code: ${DELIVERY_DEMOSIM_STATION_CODE:WS-WH-001}
    stage-delay-seconds: ${DELIVERY_DEMOSIM_STAGE_DELAY_SECONDS:4}
  auto-refill:
    # 自动补货固定周期触发方（B08-S1）。**默认关闭且写显式**：Worker 一旦装配就会按周期
    # 真实扣用户水卡余额，开发环境随手启动后台就静默扣款是不可接受的。
    # 隔离验收环境用 docker-compose 的 DAKANG_AUTO_REFILL_ENABLED 环境变量单独覆盖，不改本文件。
    enabled: false
    # 扫描间隔（毫秒，fixedDelay 语义：上一轮结束后再等这么久）。缺省 5 分钟。
    fixed-delay: 300000
    # 启动后首次扫描的延迟（毫秒），避开启动期的库连接与缓存预热。
    initial-delay: 60000

# 分润 V2（E2E-08 S2，D-428 六方口径）：已与订单完成事务接线（分流在 SplitServiceImpl
# 内，完成事务类不感知）。开关开启后，订单创建时点有生效整版计划才走 V2，
# 无计划回落 V1——切换期连续性由「版本锚=订单创建时点」保证。两环境必须显式同值。
settlement:
  # D-421 分润冻结期：分账行创建满 N 天才结算入账（与 24h 申诉窗对齐，冻结期内
  # 退款冲减零资金动作）。改天数需重启生效。
  split-freeze-days: 1
  split-v2:
    enabled: true

# D-418「0 元注册送」：注册成功自动发放赠卡。参数未定（C-01.8）前保持关闭；
# 甲方给出金额/水量/天数后填入并打开，重启服务后生效（无需代码变更）。
marketing:
  register-gift:
    enabled: false
    amount-fen: 0
    water-ml: 0
    expire-days: 0
