# 六维达康本地容器部署
# 架构：MySQL、Redis、EMQX、Backend 与 Nginx 位于同一 Compose 网络，均采用 unless-stopped 重启策略。
# 端口与本机既有 wuye-* 服务（3307/6379/13320/8080）隔离：
#   MySQL 3308 / Redis 6380 / EMQX 1883+18083 / 后端 13330 / Web 8081
#
# 用法：
#   ./build-all.sh                              # 源码包首次/日常完整构建并创建五容器
#   docker compose up -d mysql redis emqx      # 仅提前启动基础设施
#   docker compose up -d                       # 仅限 dist/JAR 已存在时恢复全套容器
#
# 入口：
#   PC 管理端     http://localhost:8081/#/dashboard/console（使用正式鉴权流程，不提供测试绕过机制）
#   后端接口      http://localhost:13330/dakangApi/（knife4j: /doc.html）
#   EMQX 管理台   http://localhost:18083/
#   MySQL 调试    localhost:3308

services:
  mysql:
    image: mysql:8.0
    container_name: dakang-mysql
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${DAKANG_DB_PASSWORD:?set DAKANG_DB_PASSWORD in .env}"
      TZ: Asia/Shanghai
    volumes:
      # 首次启动（数据卷为空时）自动执行：01 基础底座、02 业务表、03 Demo 最终菜单与契约
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - dakang-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 4s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: dakang-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${DAKANG_REDIS_PASSWORD:?set DAKANG_REDIS_PASSWORD in .env}"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6380:6379"

  emqx:
    image: emqx/emqx:5.8
    container_name: dakang-emqx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 生产必须关闭匿名接入并配置设备认证。
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${DAKANG_EMQX_DASHBOARD_PASSWORD:?set DAKANG_EMQX_DASHBOARD_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1883:1883"     # MQTT（设备/后端/模拟器接入）
      - "127.0.0.1:18083:18083"   # Dashboard
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    image: eclipse-temurin:17-jre
    container_name: dakang-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_started
    # 订单与指令时间采用 yyyyMMddHHmmss 字符串，固定使用 Asia/Shanghai 以避免时区偏差。
    environment:
      TZ: Asia/Shanghai
      DAKANG_DB_PASSWORD: "${DAKANG_DB_PASSWORD:?set DAKANG_DB_PASSWORD in .env}"
      DAKANG_REDIS_PASSWORD: "${DAKANG_REDIS_PASSWORD:?set DAKANG_REDIS_PASSWORD in .env}"
      DAKANG_MQTT_USERNAME: "${DAKANG_MQTT_USERNAME:?set DAKANG_MQTT_USERNAME in .env}"
      DAKANG_MQTT_PASSWORD: "${DAKANG_MQTT_PASSWORD:?set DAKANG_MQTT_PASSWORD in .env}"
      DAKANG_JWT_SECRET: "${DAKANG_JWT_SECRET:?set DAKANG_JWT_SECRET in .env}"
      DAKANG_RSA_PRIVATE_KEY: "${DAKANG_RSA_PRIVATE_KEY:?set DAKANG_RSA_PRIVATE_KEY in .env}"
      DAKANG_RSA_PUBLIC_KEY: "${DAKANG_RSA_PUBLIC_KEY:?set DAKANG_RSA_PUBLIC_KEY in .env}"
      # 8081 使用固定 Demo 快照，关闭心跳与指令超时扫描，避免定时任务修改验收样例。
      # 真实环境应保留默认值 true，并由真实设备或 tools/device-sim 持续上报心跳。
      DAKANG_DEVICE_MONITOR_ENABLED: "false"
      # 演示环境显式开启 API 文档（覆盖 prod profile 的默认关闭）；真生产不设此变量即默认关闭。
      SPRINGDOC_SWAGGERUI_ENABLED: "true"
      SPRINGDOC_APIDOCS_ENABLED: "true"
      KNIFE4J_ENABLE: "true"
      # 演示环境显式开启 Pay-Sim 模拟支付（覆盖 prod profile 里的 mini.pay-sim.enabled=false）。
      # 开启后 /mini/pay-sim/** 才注册，且支付单被永久打上 PAY_SOURCE=2，
      # 模拟收款不可能混进真实微信对账口径。真生产不设此变量即默认关闭。
      MINI_PAYSIM_ENABLED: "${MINI_PAYSIM_ENABLED:-false}"
    volumes:
      - ./dist/server/dakang-server.jar:/app/app.jar:ro
      - ./logs:/app/logs
    working_dir: /app
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -Dfile.encoding=UTF-8
      - -jar
      - app.jar
      - --spring.profiles.active=prod
    ports:
      - "127.0.0.1:13330:13330"

  web:
    image: nginx:1.27-alpine
    container_name: dakang-web
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist/client:/usr/share/nginx/html/pc:ro
    ports:
      - "127.0.0.1:8081:80"

volumes:
  dakang-mysql-data:
