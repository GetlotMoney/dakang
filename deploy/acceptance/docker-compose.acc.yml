# 六维达康 · 水卡生命周期验收环境（与主环境物理隔离的独立容器组）
#
# 只描述与主环境 deploy/docker-compose.yml 的差异：独立容器名 / 宿主端口 / 口令 / 数据卷。
#
# 凭据全部经 ${DAKANG_ACC_*} 从 .env 注入，缺失即拒绝启动。compose 只读取「compose 文件所在目录」
# 的 .env，故 deploy/acceptance/.env 是指向仓库根 .env 的软链（不入库），删掉它本文件就起不来。
# schema 与种子完全复用 ../mysql/init（首次启动自动执行 01/02/03），不存在第三份 DDL；
# 迁移与验收种子由 acc-env.sh 在容器就绪后按文件名顺序灌入。
#
# 为什么不用「主 compose + override 文件」：主 compose 固定了 container_name（dakang-mysql 等）、
# 宿主端口（3308/6380/1883）与数据卷，任何 -f 叠加都会定位并重建**受保护的主容器**；
# 授权边界要求绝不触碰主库（3308）数据，验收环境必须是全新的容器组，故独立成文件。
#
# 为什么带独立 EMQX 而非复用主 EMQX 做主题隔离：后端以通配 up/+/+ 订阅全部设备上行
# （MqttConnectionManager → DeviceTopics.UP_ALL），主 dakang-server 也订阅同一通配主题；
# 若验收设备接主 Broker，主服务会消费验收报文并把「未建档设备上行」审计事件写进**主库**
# ws_domain_event——主题命名隔离挡不住通配订阅（见 docs/mqtt-topics.md 上行主题设计），
# 所以只能独立 Broker（1884），验收后端与 tools/device-sim 都连它。
#
# 用法（统一经 ../acceptance/acc-env.sh，勿直接对主 compose 操作）：
#   docker compose -f deploy/acceptance/docker-compose.acc.yml up -d
#   docker compose -f deploy/acceptance/docker-compose.acc.yml down -v   # 每轮重建
name: dakang-acc

services:
  mysql:
    image: mysql:8.0.39
    container_name: dakang-acc-mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      # 验收库与主库口令由 .env 分别配置（DAKANG_ACC_DB_PASSWORD / DAKANG_DB_PASSWORD），
      # **两者必须不同**：这样脚本误配到 3308 时认证即失败，形成第二道防触主库护栏；
      # 若图省事配成同一个口令，这道护栏就没了。
      MYSQL_ROOT_PASSWORD: ${DAKANG_ACC_DB_PASSWORD:?set DAKANG_ACC_DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
      - dakang-acc-mysql-data:/var/lib/mysql
    ports:
      - "3309:3306"
    healthcheck:
      # 口令取容器内已有的 MYSQL_ROOT_PASSWORD；`$$` 是 compose 转义，写单个 `$` 会在宿主侧被展开成空串
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 4s
      retries: 60
      # Windows Docker Desktop 的 MySQL 8.0.46 空卷初始化实测约 3 分钟；宽限不足会把正常初始化误判为失败。
      start_period: 300s

  redis:
    image: redis:7-alpine
    container_name: dakang-acc-redis
    command: ["redis-server", "--requirepass", "${DAKANG_ACC_REDIS_PASSWORD:?set DAKANG_ACC_REDIS_PASSWORD in .env}"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6381:6379"

  emqx:
    image: emqx/emqx:5.8
    container_name: dakang-acc-emqx
    environment:
      TZ: Asia/Shanghai
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${DAKANG_ACC_EMQX_DASHBOARD_PASSWORD:?set DAKANG_ACC_EMQX_DASHBOARD_PASSWORD in .env}
    ports:
      - "1884:1883"
      - "18084:18083"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    image: eclipse-temurin:17-jre
    container_name: dakang-acc-server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DAKANG_DB_USERNAME: root
      DAKANG_DB_PASSWORD: ${DAKANG_ACC_DB_PASSWORD:?set DAKANG_ACC_DB_PASSWORD in .env}
      DAKANG_REDIS_PASSWORD: ${DAKANG_ACC_REDIS_PASSWORD:?set DAKANG_ACC_REDIS_PASSWORD in .env}
      DAKANG_JWT_SECRET: ${DAKANG_JWT_SECRET:?set DAKANG_JWT_SECRET in .env}
      DAKANG_RSA_PRIVATE_KEY: ${DAKANG_RSA_PRIVATE_KEY:?set DAKANG_RSA_PRIVATE_KEY in .env}
      DAKANG_RSA_PUBLIC_KEY: ${DAKANG_RSA_PUBLIC_KEY:?set DAKANG_RSA_PUBLIC_KEY in .env}
      DAKANG_MQTT_USERNAME: ""
      DAKANG_MQTT_PASSWORD: ""
    volumes:
      - ../../server/target/dakang-server.jar:/app/app.jar:ro
      - ./.run/data:/app/data
    command:
      - java
      - -Xms256m
      - -Xmx512m
      - -Dfile.encoding=UTF-8
      - -jar
      - /app/app.jar
      - --spring.profiles.active=prod
      - --server.port=13340
      - --spring.datasource.druid.url=jdbc:mysql://mysql:3306/dakang?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC&nullCatalogMeansCurrent=true
      - --spring.datasource.druid.username=root
      - --spring.datasource.druid.password=${DAKANG_ACC_DB_PASSWORD}
      - --spring.redis.host=redis
      - --spring.redis.port=6379
      - --spring.redis.password=${DAKANG_ACC_REDIS_PASSWORD}
      - --spring.ratelimiter.redis-address=redis://redis:6379
      - --spring.ratelimiter.redis-password=${DAKANG_ACC_REDIS_PASSWORD}
      - --mqtt.enabled=true
      - --mqtt.broker-url=tcp://emqx:1883
      - --mqtt.client-id=dakang-server-acc
      - --mini.pay-sim.enabled=true
      - --mini.test-login.enabled=true
      - --mini.refund-sim.enabled=true
      - --mall.pay-sim.enabled=true
      - --mall.refund-sim.enabled=true
      - --mall.logistics-sim.enabled=true
      - --mall.logistics-outbox.fixed-delay=${ACC_LOGISTICS_OUTBOX_DELAY:-5000}
      - --mall.logistics-outbox.initial-delay=${ACC_LOGISTICS_OUTBOX_INITIAL_DELAY:-5000}
      - --delivery.auto-refill.enabled=${ACC_AUTO_REFILL_ENABLED:-false}
      - --delivery.auto-refill.fixed-delay=${ACC_AUTO_REFILL_FIXED_DELAY:-300000}
      - --delivery.auto-refill.initial-delay=${ACC_AUTO_REFILL_INITIAL_DELAY:-60000}
      - --delivery.demo-sim.enabled=false
      - --demo-simulation.enabled=${ACC_DEMO_SIMULATION_ENABLED:-false}
      - --settlement.split-freeze-days=0
      - --dakang.device.monitor-enabled=${ACC_MONITOR_ENABLED:-false}
      - --dakang.device.control-ticket-ttl-seconds=${ACC_CONTROL_TICKET_TTL:-120}
    ports:
      - "127.0.0.1:13340:13340"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/13340"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s

volumes:
  dakang-acc-mysql-data:
