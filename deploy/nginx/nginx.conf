# 六维达康 · Web 入口（容器内 80，宿主 8081）
# / → PC 管理端静态（hash 路由，无需 history fallback）
# 业务前缀 → 后端 13330/dakangApi（与 client/vite.config.ts 代理前缀保持一致，新模块前缀在两处同步追加）

# 区分“浏览器打开页面”和“前端调用接口”。PC 使用 Hash 路由，浏览器误开
# /device/index 时应纠正为 /#/device/index；JSON 请求继续反代后端。
map "$request_method:$http_accept" $is_html_navigation {
    default 0;
    ~*^GET:.*text/html 1;
}

server {
    listen 80;
    server_name localhost;
    # 容器内监听 80、宿主映射 8081；保持 Location 为相对地址才能保留外部端口。
    absolute_redirect off;
    client_max_body_size 100m;
    # 8081 是 PC Demo 唯一基线/验收入口；自动化可通过响应头确认没有误入 Vite。
    add_header X-Dakang-Entry "pc-demo-canonical" always;

    # PC 管理端
    location / {
        root /usr/share/nginx/html/pc;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 这些前缀只承载前端页面，保留误写无 # 地址时的原目标。
    location ~ ^/(auth|dashboard|system|log)(/|$) {
        if ($is_html_navigation) {
            return 302 "/#$request_uri";
        }

        root /usr/share/nginx/html/pc;
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反代：系统底座 + 一期业务前缀（5+1：station/device/product/user/order + delivery 共用）
    # 商业一期启用财务/运维时追加：finance、workorder（与 client/vite.config.ts 保持一致）
    location ~ ^/(station|device|product|user|order)(/|$) {
        # station/device/product/user/order 与前端页面同名，仅 HTML 导航纠正为 Hash URL。
        if ($is_html_navigation) {
            return 302 "/#$request_uri";
        }

        proxy_pass http://backend:13330/dakangApi$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 纯接口前缀，不参与页面地址纠正；/mini 为小程序端接口（L1a 起）。
    location ~ ^/(api|delivery|mini)(/|$) {
        proxy_pass http://backend:13330/dakangApi$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Knife4j 文档反向代理；生产环境可按安全策略关闭。
    location /dakangApi/ {
        proxy_pass http://backend:13330;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
